<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>DiveMap 潛水地圖</title>
<!-- 內部版本紀錄：v78 - 2026-07-29（天氣圖層擴充：新增風速、雲量，改為可展開面板同時管理三種圖層） -->
<meta name="description" content="全球潛點地圖，AI 行程規劃、船宿路線、即時天氣">
<meta name="theme-color" content="#0a1520">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DiveMap">
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://basemaps.cartocdn.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.open-meteo.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
.leaflet-container{background:#0d1c2e;font-family:'DM Sans',sans-serif}
.dm-tile{filter:brightness(1.9) contrast(1.15)}
.leaflet-control-attribution{background:rgba(10,21,32,.7)!important;color:var(--tm)!important;font-size:8px!important}
.leaflet-control-attribution a{color:var(--ts)!important}
.dive-mk{position:absolute;left:0;top:0}
.transport-pt{position:absolute;left:0;top:0}
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a1520;overflow:hidden}
:root{
  --bg:#0a1520;--surf:#0d1c2e;--card:#102338;--hover:#142c46;
  --b:rgba(26,58,92,.7);
  --t:#e8f4ff;--ts:#7aabb0;--tm:#3d6070;
  --blue:#0ea5e9;--red:#ef4444;--amber:#f59e0b;--cyan:#38bdf8;--green:#10b981;
  font-family:'DM Sans',sans-serif;
}
.app{background:var(--bg);overflow:hidden;display:flex;flex-direction:column;height:100vh;height:100dvh;width:100vw;margin:0}
.topbar{background:rgba(10,21,32,.97);padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:0.5px solid var(--b);flex-shrink:0;z-index:10}
.logo{font-size:15px;font-weight:600;color:var(--t);flex-shrink:0}
.logo span{color:var(--blue)}
.searchbox{flex:1;background:rgba(255,255,255,.06);border:0.5px solid var(--b);border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:6px}
.searchbox input{background:none;border:none;outline:none;font-size:12px;color:var(--t);width:100%}
.searchbox input::placeholder{color:var(--tm)}
.ib{width:30px;height:30px;background:rgba(255,255,255,.06);border:0.5px solid var(--b);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ts);font-size:14px;cursor:pointer;flex-shrink:0}
.ib.on{background:rgba(56,189,248,.15);border-color:rgba(56,189,248,.4);color:var(--cyan)}
.ib.loading{animation:ib-pulse 1s ease-in-out infinite}
@keyframes ib-pulse{0%,100%{opacity:1}50%{opacity:.4}}
.bc{padding:7px 14px;font-size:11px;color:var(--ts);background:rgba(10,21,32,.7);border-bottom:0.5px solid var(--b);display:flex;align-items:center;gap:5px;z-index:10}
.bci{cursor:pointer;padding:2px 6px;border-radius:5px}
.bci:hover{background:rgba(255,255,255,.06);color:var(--t)}
.bci.act{color:var(--blue);font-weight:500}
.body{display:flex;flex:1;overflow:hidden;position:relative}
.sidebar{width:0;background:var(--surf);border-right:0.5px solid transparent;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .22s ease,border-color .22s}
.sidebar.open{width:190px;border-right-color:var(--b)}
.sb-inner{width:190px;display:flex;flex-direction:column;flex:1;overflow:hidden}
.sb-hdr{padding:10px 12px 5px;flex-shrink:0;display:flex;justify-content:space-between}
.sb-ttl{font-size:10px;color:var(--tm);text-transform:uppercase;letter-spacing:.08em}
.sb-close{cursor:pointer;color:var(--tm)}
.sb-list{flex:1;overflow-y:auto;padding:4px 6px 8px}
.si{padding:6px 8px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:7px;margin-bottom:2px}
.si:hover{background:var(--hover)}
.si.act{background:rgba(14,165,233,.1);border:0.5px solid rgba(14,165,233,.25)}
.si-swatch{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.si-name{font-size:12px;color:var(--t);flex:1}
.si-sub{font-size:9px;color:var(--tm);font-family:'DM Mono',monospace;flex-shrink:0}
.si-badge{font-size:8px;padding:1px 6px;border-radius:99px;flex-shrink:0;border:0.5px solid}
.si.route{background:rgba(16,185,129,.08);color:#34d399}
.si.route:hover{background:rgba(16,185,129,.15)}
.route-badge{position:absolute;top:10px;left:10px;background:rgba(16,185,129,.15);border:0.5px solid rgba(16,185,129,.4);border-radius:8px;padding:6px 10px;font-size:10px;color:#34d399;display:flex;align-items:center;gap:5px;z-index:6}
.route-mk-num{width:20px;height:20px;border-radius:50%;background:var(--green);color:#04342c;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(16,185,129,.2)}
.route-mk-lbl{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--ts);background:rgba(10,21,32,.9);padding:2px 6px;border-radius:3px;white-space:nowrap;border:0.5px solid var(--b)}
.transport-pt{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
.transport-pt-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--amber);background:rgba(245,158,11,.25);box-shadow:0 0 0 4px rgba(245,158,11,.15)}
.transport-pt.transport-to .transport-pt-dot{border-color:var(--blue);background:rgba(56,189,248,.25);box-shadow:0 0 0 4px rgba(56,189,248,.15)}
.transport-pt-lbl{font-size:9px;color:var(--t);background:rgba(10,21,32,.92);padding:2px 7px;border-radius:3px;white-space:nowrap;border:0.5px solid var(--b);font-weight:500}
.route-hdr{padding:14px;border-bottom:0.5px solid var(--b)}
.route-ttl{font-size:14px;font-weight:500;color:var(--t);margin-bottom:2px}
.route-sub{font-size:10px;color:var(--tm)}
.route-days{padding:12px}
.route-day{position:relative;padding-left:16px;padding-bottom:10px;font-size:11px}
.route-day::before{content:'';position:absolute;left:3px;top:14px;bottom:-2px;width:0.5px;background:var(--b)}
.route-day:last-child::before{display:none}
.route-day-dot{position:absolute;left:0;top:2px;width:8px;height:8px;border-radius:50%;background:var(--green)}
.route-day-lbl{color:var(--t);font-weight:500}
.route-day-sub{color:var(--tm);font-size:9px}
.sb-peek{position:absolute;left:0;top:12px;z-index:8;width:18px;height:40px;background:rgba(13,28,46,.92);border:0.5px solid var(--b);border-left:none;border-radius:0 10px 10px 0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tm)}
.sb-peek.hidden{opacity:0;pointer-events:none}
.panel-peek{position:absolute;right:0;top:12px;z-index:8;width:18px;height:40px;background:rgba(13,28,46,.92);border:0.5px solid var(--b);border-right:none;border-radius:10px 0 0 10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tm)}
.panel-peek.hidden{opacity:0;pointer-events:none}
.map-wrap{flex:1;position:relative;overflow:hidden;background:var(--surf);cursor:grab}
.map-layer{position:absolute;inset:0;transform-origin:0 0}
.map-layer.animate{transition:transform .5s cubic-bezier(0.22,1,0.36,1)}
.world-svg{position:absolute;left:0;top:0}
.country-fill{pointer-events:none}
.country-hit{cursor:pointer;fill:transparent;stroke:none}
.mk-layer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--tm);font-size:12px;gap:8px;z-index:20;background:var(--surf)}
.spin{width:14px;height:14px;border:2px solid var(--b);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.wx-card{position:absolute;top:10px;left:10px;background:rgba(13,28,46,.94);border:0.5px solid rgba(56,189,248,.3);border-radius:10px;padding:7px 11px;font-size:10px;color:var(--cyan);display:flex;align-items:center;gap:8px;z-index:6;opacity:0;transition:opacity .3s}
.wx-panel{position:absolute;top:44px;right:10px;width:172px;background:rgba(13,28,46,.97);border:0.5px solid var(--b);border-radius:12px;padding:8px;z-index:9;display:none;flex-direction:column;gap:2px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.wx-panel.show{display:flex}
.wx-row{display:flex;align-items:center;justify-content:space-between;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--t)}
.wx-row:hover{background:rgba(255,255,255,.05)}
.wx-row-label{display:flex;align-items:center;gap:8px}
.wx-sw{width:30px;height:17px;border-radius:9px;background:rgba(255,255,255,.12);position:relative;flex-shrink:0;transition:background .2s}
.wx-sw::after{content:'';position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s}
.wx-row.active .wx-sw{background:var(--cyan)}
.wx-row.active .wx-sw::after{left:15px}
.wx-row.loading .wx-sw{opacity:.4}
.wx-card.show{opacity:1}
.wx-t{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;color:var(--t)}
.wx-sub{color:var(--tm);font-size:9px}
.map-ctrl{position:absolute;left:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;z-index:6}
.stats{position:absolute;bottom:10px;right:10px;background:rgba(13,28,46,.92);border:0.5px solid var(--b);border-radius:10px;padding:8px 12px;z-index:6}
.st-v{font-family:'DM Mono',monospace;font-size:14px;color:var(--t)}
.dive-mk{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transform:translate(-50%,-50%);pointer-events:auto;transition:left .5s cubic-bezier(0.22,1,0.36,1),top .5s cubic-bezier(0.22,1,0.36,1);z-index:1}
.dive-mk.country-pin{transform:translate(-50%,-100%);gap:1px}
.country-pin-svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.dive-mk:hover{z-index:3}
.dive-mk .ring{width:13px;height:13px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:7px}
.dive-mk .ring.mu{background:rgba(14,165,233,.25);border-color:var(--blue);color:var(--blue)}
.dive-mk .ring.mv{background:rgba(239,68,68,.25);border-color:var(--red);color:var(--red)}
.dive-mk .lbl{font-size:8px;color:var(--ts);background:rgba(10,21,32,.94);padding:1px 5px;border-radius:3px;white-space:nowrap;border:0.5px solid var(--b);opacity:0;transition:opacity .15s}
.dive-mk:hover .lbl{opacity:1}
.dive-mk.sel{z-index:5}
.dive-mk.sel .ring{transform:scale(1.5);box-shadow:0 0 0 4px rgba(56,189,248,.25),0 0 12px rgba(56,189,248,.6);animation:selPulse 1.6s ease-in-out infinite}
.dive-mk.sel .lbl{opacity:1;background:rgba(14,165,233,.95);color:#fff;border-color:var(--blue);font-weight:600}
.dive-mk.sel .route-mk-num{transform:scale(1.4);box-shadow:0 0 0 4px rgba(56,189,248,.3),0 0 12px rgba(56,189,248,.7);animation:selPulse 1.6s ease-in-out infinite;background:var(--blue);color:#fff}
.dive-mk.sel .route-mk-lbl{background:rgba(14,165,233,.95);color:#fff;border-color:var(--blue);font-weight:600}
@keyframes selPulse{0%,100%{box-shadow:0 0 0 4px rgba(56,189,248,.25),0 0 12px rgba(56,189,248,.6)}50%{box-shadow:0 0 0 7px rgba(56,189,248,.12),0 0 16px rgba(56,189,248,.8)}}
.panel{width:0;background:var(--card);border-left:0.5px solid var(--b);overflow-y:auto;flex-shrink:0;transition:width .3s ease}
.panel.open{width:240px}
.hero{width:100%;height:90px;overflow:hidden;flex-shrink:0;position:relative}
.visit-badge{position:absolute;top:8px;right:8px;background:rgba(16,185,129,.85);color:#fff;font-size:9px;font-weight:600;padding:3px 8px;border-radius:99px}
.pbody{padding:14px}
.pname{font-size:16px;font-weight:600;color:var(--t);margin-bottom:1px}
.pnameen{font-size:11px;color:var(--tm);margin-bottom:10px}
.status-card{background:linear-gradient(135deg, rgba(56,189,248,.08), rgba(245,158,11,.08));border:0.5px solid rgba(56,189,248,.25);border-radius:10px;padding:9px 11px;margin-bottom:10px}
.status-row{display:flex;align-items:center;justify-content:space-between}
.status-wx{display:flex;align-items:center;gap:7px}
.status-temp{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;color:var(--t)}
.status-sub{font-size:9px;color:var(--tm)}
.ptags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.ptag{font-size:10px;padding:2px 7px;border-radius:4px;border:0.5px solid}
.tb{background:rgba(14,165,233,.1);border-color:rgba(14,165,233,.25);color:#38bdf8}
.tg{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.2);color:#34d399}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:9px}
.mc{background:var(--surf);border:0.5px solid var(--b);border-radius:6px;padding:6px 8px}
.mc-l{font-size:9px;color:var(--tm);text-transform:uppercase}
.mc-v{font-size:11px;font-weight:500;color:var(--t)}
.pdesc{font-size:11px;color:var(--ts);line-height:1.55}
.expand-section{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(0.22,1,0.36,1)}
.panel.expanded .expand-section{max-height:260px}
.exp-divider{height:0.5px;background:var(--b);margin:10px 0}
.exp-block{margin-bottom:10px}
.exp-label{font-size:9px;color:var(--tm);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.visit-history{background:var(--surf);border:0.5px solid var(--b);border-radius:8px;padding:7px 9px}
.visit-row{display:flex;justify-content:space-between;font-size:10px;padding:2px 0}
.note-box{background:var(--surf);border:0.5px solid var(--b);border-left:2px solid var(--blue);border-radius:0 8px 8px 0;padding:7px 9px;font-size:10px;color:var(--ts);font-style:italic;line-height:1.5}
.source-row{font-size:9px;color:var(--tm);line-height:1.5}
.expand-btn{width:100%;background:rgba(14,165,233,.08);border:0.5px solid rgba(14,165,233,.25);border-radius:8px;padding:7px;font-size:10px;font-weight:500;color:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;margin-top:2px}
.expand-btn i{transition:transform .3s;font-size:12px}
.panel.expanded .expand-btn i{transform:rotate(180deg)}
.searchwrap{flex:1;position:relative}
.searchbox.ai-mode{border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.08)}
.mode-pill{font-size:9px;padding:4px 10px;border-radius:999px;background:rgba(16,185,129,.12);color:#34d399;border:0.5px solid rgba(16,185,129,.3);display:flex;align-items:center;gap:4px;flex-shrink:0}
.route-svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.route-path{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:5,4;opacity:.65}
.panel-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tm);font-size:11px;gap:8px;padding:20px;text-align:center}
.isl-hdr{padding:14px;border-bottom:0.5px solid var(--b)}
.isl-name{font-size:15px;font-weight:600;color:var(--t);margin-bottom:1px}
.isl-count{font-size:10px;color:var(--tm)}
.isl-body{padding:14px}
.isl-sec-lbl{font-size:9px;color:var(--tm);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.month-row{display:flex;gap:2px;margin-bottom:12px}
.month-pill{flex:1;text-align:center;font-size:8px;padding:5px 0;border-radius:4px;background:var(--surf);border:0.5px solid var(--b);color:var(--tm);font-weight:500}
.month-pill.rain{background:rgba(56,189,248,.18);border-color:rgba(56,189,248,.4);color:#38bdf8}
.month-pill.dry{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.35);color:#fbbf24}
.month-pill.close{background:rgba(239,68,68,.22);border-color:rgba(239,68,68,.45);color:#f87171}
.isl-legend{display:flex;gap:10px;margin-bottom:6px}
.isl-legend-item{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--ts)}
.isl-dot{width:7px;height:7px;border-radius:2px}
.isl-dot.rain{background:#38bdf8}.isl-dot.dry{background:#fbbf24}.isl-dot.close{background:#ef4444}
.wild-list{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.wild-item{background:var(--surf);border:0.5px solid var(--b);border-radius:8px;padding:7px 9px;font-size:10px;color:var(--ts);line-height:1.5}
.isl-empty-note{font-size:9px;color:var(--tm);font-style:italic;padding:8px 0}
.isl-hint{font-size:9px;color:var(--tm);text-align:center;padding:10px 14px;border-top:0.5px solid var(--b)}
.back-to-isl{font-size:10px;color:var(--blue);padding:8px 14px;cursor:pointer;border-bottom:0.5px solid var(--b);flex-shrink:0}
.back-to-isl:hover{background:var(--hover)}
.dive-mk .ring.itin{background:var(--green);border-color:#04342c;color:#04342c;font-family:'DM Mono',monospace;font-weight:600}
.dive-mk.itin .lbl{opacity:1}
.chat-hdr{padding:10px 12px;border-bottom:0.5px solid var(--b);font-size:10px;color:var(--tm);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.chat-body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:90%;padding:7px 10px;border-radius:10px;font-size:10.5px;line-height:1.5;opacity:0;transform:translateY(6px);animation:in .3s ease forwards}
@keyframes in{to{opacity:1;transform:translateY(0)}}
.bubble.ai{background:var(--surf);border:0.5px solid var(--b);color:var(--t);align-self:flex-start}
.bubble.user{background:rgba(14,165,233,.15);border:0.5px solid rgba(14,165,233,.3);color:var(--t);align-self:flex-end}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-self:flex-start;max-width:95%}
.chip{font-size:9px;padding:5px 10px;border-radius:999px;background:var(--surf);border:0.5px solid var(--b);color:var(--ts);cursor:pointer}
.chip:hover{border-color:var(--blue);color:var(--t)}
.thinking{align-self:flex-start;display:flex;gap:4px;padding:6px 10px}
.dot{width:4px;height:4px;border-radius:50%;background:var(--tm);animation:pulse 1.2s ease infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,60%,100%{opacity:.3}30%{opacity:1}}
.panel.itin-open{width:280px}
.itin-scroll{flex:1;overflow-y:auto}
.itin-hdr{padding:12px;background:linear-gradient(135deg, rgba(56,189,248,.06), rgba(16,185,129,.06));border-bottom:0.5px solid var(--b)}
.itin-tag{font-size:9px;color:var(--green);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.itin-ttl{font-size:12px;font-weight:500;color:var(--t);margin-bottom:8px;line-height:1.4}
.itin-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.itin-meta-item{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--ts)}
.itin-match{display:flex;gap:5px;flex-wrap:wrap;padding-top:8px;border-top:0.5px solid rgba(255,255,255,.06)}
.itin-match-tag{font-size:8px;padding:2px 7px;border-radius:99px;background:rgba(16,185,129,.12);color:#34d399;border:0.5px solid rgba(16,185,129,.25)}
.itin-note{margin:10px;background:rgba(245,158,11,.06);border:0.5px solid rgba(245,158,11,.25);border-radius:8px;padding:8px 9px;font-size:9px;color:var(--ts);line-height:1.6}
.itin-days{padding:10px}
.itin-day{position:relative;padding-left:16px;padding-bottom:10px;cursor:pointer}
.itin-day:last-child{padding-bottom:0}
.itin-day::before{content:'';position:absolute;left:4px;top:16px;bottom:-2px;width:0.5px;background:var(--b)}
.itin-day:last-child::before{display:none}
.itin-day-dot{position:absolute;left:0;top:3px;width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--blue)}
.itin-day-dot.sel{background:var(--green);border-color:var(--green)}
.itin-day-hdr{display:flex;align-items:center;gap:5px;margin-bottom:6px;font-size:9px;flex-wrap:wrap}
.itin-day-num{color:var(--tm);text-transform:uppercase}
.itin-day-date{color:var(--t);font-weight:500;font-size:10.5px}
.itin-day-badge{font-size:7px;padding:1px 6px;border-radius:99px;background:rgba(16,185,129,.12);color:#34d399;border:0.5px solid rgba(16,185,129,.25)}
.mini-site{background:var(--surf);border:0.5px solid var(--b);border-radius:8px;padding:7px 8px;margin-bottom:4px}
.mini-site.sel{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.05)}
.mini-site-name{font-size:10.5px;font-weight:500;color:var(--t)}
.mini-site-tags{display:flex;gap:3px;flex-wrap:wrap;margin:3px 0}
.mini-tag{font-size:8px;padding:1px 5px;border-radius:3px;border:0.5px solid}
.mini-desc{font-size:9px;color:var(--ts);line-height:1.5}
.transport-mini{background:rgba(245,158,11,.06);border:0.5px solid rgba(245,158,11,.2);border-radius:8px;padding:6px 8px;margin-bottom:4px;display:flex;flex-direction:column;gap:2px}
.transport-mini-text{font-size:9px;color:var(--ts);display:flex;align-items:center;gap:4px}
.transport-mini-price{font-size:9.5px;font-weight:500;color:var(--amber);font-family:'DM Mono',monospace}
.rest-mini{font-size:8.5px;color:var(--tm);font-style:italic;padding:2px 0 4px}
.budget-box{padding:10px;background:rgba(255,255,255,.02);border-top:0.5px solid var(--b)}
.budget-ttl{font-size:9px;color:var(--tm);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.budget-row{display:flex;justify-content:space-between;font-size:9.5px;color:var(--ts);padding:3px 0;border-bottom:0.5px solid rgba(255,255,255,.04)}
.budget-total{display:flex;justify-content:space-between;padding-top:8px;margin-top:5px;border-top:0.5px solid var(--b)}
.budget-total-label{font-size:10.5px;font-weight:500;color:var(--t)}
.budget-total-val{font-size:13px;font-weight:500;color:var(--amber);font-family:'DM Mono',monospace}
.itin-caveat{padding:10px 10px 12px;font-size:8.5px;color:var(--tm);line-height:1.5;display:flex;gap:5px}

function flyTo(lng,lat,scale){camScale=scale;map.flyTo([lat,lng],scale,{animate:true,duration:0.7});}
function fitViewAroundCenter(items,centerLng,centerLat,fbZoom,pad,maxZoom,minZoom){
  minZoom=minZoom||3;
  if(!items||!items.length)return{lng:centerLng,lat:centerLat,scale:fbZoom};
  var bounds=L.latLngBounds(items.map(function(it){return [it.lat,it.lng];}));
  bounds=bounds.pad(0.25);
  var z=map.getBoundsZoom(bounds);
  z=Math.max(minZoom,Math.min(z,maxZoom));
  return{lng:centerLng,lat:centerLat,scale:z};
}

var weatherCache={};
async function fetchRealWeather(isl){
  if(weatherCache[isl.id])return weatherCache[isl.id];
  try{
    var url='https://api.open-meteo.com/v1/forecast?latitude='+isl.lat+'&longitude='+isl.lng+'&current=temperature_2m,precipitation&timezone=auto';
    var res=await fetch(url);
    var data=await res.json();
    var result={temp:Math.round(data.current.temperature_2m*10)/10,rain:data.current.precipitation>0?Math.min(100,Math.round(data.current.precipitation*20)):0,live:true};
    weatherCache[isl.id]=result;
    return result;
  }catch(err){
    console.error('weather fetch failed',err);
    return {temp:isl.wxT,rain:isl.wxR,live:false};
  }
}

var weatherLayers={rain:null,wind:null,clouds:null};
var rainApiData=null;

function setRowState(type,state){
  var row=document.getElementById('wx-row-'+type);
  row.classList.toggle('active',state==='on');
  row.classList.toggle('loading',state==='loading');
  document.getElementById('rain-toggle').classList.toggle('on',!!weatherLayers.rain||!!weatherLayers.wind||!!weatherLayers.clouds);
}
window.toggleWeatherLayer=function(type){
  if(weatherLayers[type]){
    map.removeLayer(weatherLayers[type]);
    weatherLayers[type]=null;
    setRowState(type,'off');
    return;
  }
  setRowState(type,'loading');
  if(type==='rain'){
    var applyRain=function(){
      if(!rainApiData||!rainApiData.radar||!rainApiData.radar.past||!rainApiData.radar.past.length){setRowState('rain','off');return;}
      var frame=rainApiData.radar.past[rainApiData.radar.past.length-1];
      weatherLayers.rain=L.tileLayer(rainApiData.host+frame.path+'/256/{z}/{x}/{y}/2/1_1.png',{tileSize:256,opacity:0.55,maxNativeZoom:7,maxZoom:19,zIndex:5}).addTo(map);
      setRowState('rain','on');
    };
    if(rainApiData){applyRain();return;}
    fetch('https://api.rainviewer.com/public/weather-maps.json').then(function(r){return r.json();}).then(function(data){rainApiData=data;applyRain();}).catch(function(err){
      console.error('rain radar fetch failed',err);setRowState('rain','off');
    });
  } else {
    var layerName=type==='wind'?'wind_new':'clouds_new';
    var lyr=L.tileLayer('https://tile.openweathermap.org/map/'+layerName+'/{z}/{x}/{y}.png?appid='+OWM_KEY,{opacity:0.55,maxZoom:19,zIndex:5});
    lyr.on('tileerror',function(){console.warn(type+' 圖層載入失敗，API key可能還沒生效或已達額度');});
    lyr.addTo(map);
    weatherLayers[type]=lyr;
    setRowState(type,'on');
  }
};

  } else {

    peek.classList.remove('hidden');
  }
};
if(typeof ResizeObserver!=='undefined'){
  var resizeDebounce=null;
  new ResizeObserver(function(){
    clearTimeout(resizeDebounce);
    resizeDebounce=setTimeout(function(){map.invalidateSize();},120);
  }).observe(document.getElementById('map-wrap'));
}
document.getElementById('sq').addEventListener('input',function(e){var q=e.target.value.trim();if(!q)return;var c=COUNTRIES.find(function(x){return x.name.indexOf(q)>-1;});if(c)drillCountry(c.id);});
function loadWorld(){ render(); }
/* ===== AI 對話規劃層（疊加，不影響探索模式與既有 154 個潛點資料）===== */
var searchbox=document.getElementById('searchbox');
var searchInput=document.getElementById('sq');
var searchIcon=document.getElementById('search-icon');
searchInput.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var v=searchInput.value.trim();if(!v)return;
  var isNatural=v.length>=5 && /[想要幫我推薦？?]/.test(v);
  if(isNatural){ startAiChat(v); }
  else{
    var c=COUNTRIES.find(function(x){return x.name.indexOf(v)>-1;});
    var isl=null;Object.keys(ISLANDS).forEach(function(k){ISLANDS[k].forEach(function(i){if(i.name.indexOf(v)>-1)isl={country:k,id:i.id};});});
    if(isl){drillCountry(isl.country);drillIsland(isl.id);}else if(c){drillCountry(c.id);}
  }
});
function startAiChat(query){
  mode='chat';
  toggleSb(false);
  searchbox.classList.add('ai-mode');
  searchIcon.textContent='✨';searchIcon.style.color='var(--green)';
  searchInput.value=query;searchInput.disabled=true;
  var panel=document.getElementById('panel');
  panel.classList.add('open');panel.classList.remove('itin-open');
  panel.innerHTML='<div class="chat-hdr">AI 規劃助手 ✨</div><div class="chat-body" id="chat-body"></div>';
  var body=document.getElementById('chat-body');
  addBubble(body,query,'user');
  addThinking(body,function(){
    addBubble(body,'好的，先確認幾個必要條件。你大概有幾天假期？','ai');
    addChips(body,['5 天','7 天','10 天以上'],function(v){
      chatState.days=v;
      addThinking(body,function(){
        addBubble(body,'你會從哪裡出發？','ai');
        addChips(body,['新加坡','台北','吉隆坡','其他城市'],function(vCity){
          chatState.departureCity=vCity;
          addThinking(body,function(){
            addBubble(body,'潛水證照大概到哪個等級？','ai');
            addChips(body,['OW 入門','AOW 30 潛以上','更高階'],function(v2){
              chatState.cert=v2;
              addThinking(body,function(){
                addBubble(body,'最想看到什麼生態？','ai');
                addChips(body,['海龜、鯊魚','微距、沉船','都好'],function(v3){
                  chatState.wildlife=v3;
                  addThinking(body,function(){
                    addBubble(body,'比較喜歡跳島定點還是船宿巡航？','ai');
                    addChips(body,['跳島定點','船宿巡航'],function(v4){
                      chatState.diveStyle=v4;
                      addThinking(body,function(){ showItineraryResult(body); },1200);
                    });
                  });
                });
              });
            });
          });
        });
      });
    });
  });
}
function addBubble(body,text,who){var d=document.createElement('div');d.className='bubble '+who;d.textContent=text;body.appendChild(d);body.scrollTop=body.scrollHeight;}
function addChips(body,options,onPick){
  var wrap=document.createElement('div');wrap.className='chips';
  options.forEach(function(opt){var c=document.createElement('div');c.className='chip';c.textContent=opt;c.onclick=function(){wrap.remove();addBubble(body,opt,'user');onPick(opt);};wrap.appendChild(c);});
  body.appendChild(wrap);body.scrollTop=body.scrollHeight;
}
function addThinking(body,cb,delay){
  var t=document.createElement('div');t.className='thinking';t.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  body.appendChild(t);body.scrollTop=body.scrollHeight;
  setTimeout(function(){t.remove();cb();},delay||900);
}
function showItineraryResult(body){
  if(chatState.diveStyle==='船宿巡航'){
    addBubble(body,'幫你排了一份船宿行程：搭乘 Prince Ulua 跑馬爾地夫四方線，5 天走完 Kaafu、Alif、Vaavu 三個環礁區域。','ai');
  } else {
    addBubble(body,'幫你排了一份行程：馬布島當基地，跳島西巴丹看海龜鯊魚，穿插馬布島/卡帕來調整潛。','ai');
  }
  buildItineraryData();
  var btn=document.createElement('button');
  btn.className='chip';btn.style.cssText='align-self:stretch;text-align:center;margin-top:4px;border-color:rgba(16,185,129,.4);color:#34d399';
  btn.textContent='查看完整行程 →';
  btn.onclick=function(){enterItinerary();};
  body.appendChild(btn);body.scrollTop=body.scrollHeight;
}
function buildItineraryData(){
  var city=chatState.departureCity||'新加坡';
  var cityCoord=CITY_COORDS[city]||CITY_COORDS['新加坡'];
  if(chatState.diveStyle==='船宿巡航'){
    var route=ROUTES.mv[0];
    var days=[];
    route.stops.forEach(function(s,i){
      var isl=ISLANDS.mv.find(function(x){return x.id===s.islandId;});
      if(i===0){
        days.push({label:'D1 '+isl.name,island:isl.name,islandLng:isl.lng,islandLat:isl.lat,
          fromPt:{lng:cityCoord.lng,lat:cityCoord.lat,label:city},toPt:{lng:isl.lng,lat:isl.lat,label:isl.name},
          transport:[
          {icon:'✈️',text:city+'→男性島（機票，含轉機）',price:'約 NT$16,000'}
        ],rest:'抵達'+isl.name+'登船，裝備檢查，晚上啟航。'});
      } else if(i===route.stops.length-1){
        days.push({label:'D'+(i+1)+' '+isl.name,island:isl.name,islandLng:isl.lng,islandLat:isl.lat,rest:isl.name+'潛水後返航男性島。',
          fromPt:{lng:isl.lng,lat:isl.lat,label:isl.name},toPt:{lng:cityCoord.lng,lat:cityCoord.lat,label:city},
          transport:[
          {icon:'✈️',text:'男性島→'+city+'（機票，含轉機）',price:'約 NT$16,000'}
        ]});
      } else {
        days.push({label:'D'+(i+1)+' '+isl.name,island:isl.name,islandLng:isl.lng,islandLat:isl.lat});
      }
    });
    itinerary={
      country:'mv',
      departureCityLng:cityCoord.lng,departureCityLat:cityCoord.lat,
      title:route.name+' · '+route.operator,
      days:days,
      budget:[
        {label:city+'來回機票',val:'約 NT$32,000'},
        {label:'船宿套裝（'+route.days+'天，含餐飲）',val:'約 NT$45,000'}
      ],
      total:'約 NT$77,000'
    };
    return;
  }
  var sipadanSites=SITES.sipadan||[],mabulSites=SITES.mabul||[],kapalaiSites=SITES.kapalai||[];
  function findSite(arr,name){var f=arr.filter(function(s){return s.name===name;});return f[0]||arr[0];}
  itinerary={
    country:'my',
    departureCityLng:cityCoord.lng,departureCityLat:cityCoord.lat,
    title:'馬布島基地 · 西巴丹跳島 7 天大型生物行程',
    days:[
      {label:'D1 抵達',island:'馬布島',islandLng:118.6167,islandLat:4.2333,
        fromPt:{lng:cityCoord.lng,lat:cityCoord.lat,label:city},toPt:{lng:118.6167,lat:4.2333,label:'馬布島'},
        transport:[
        {icon:'✈️',text:city+'→斗湖（機票）',price:'約 NT$4,500'},
        {icon:'🚗',text:'斗湖→仙本那→快艇上馬布島',price:'約 NT$1,200'}
      ],rest:'下午抵達度假村，裝備檢查，早點休息準備隔天配額潛水。'},
      {label:'D2 西巴丹跳島日 1',badge:'配額日',site:findSite(sipadanSites,'Barracuda Point')},
      {label:'D3 馬布島調整日',site:findSite(mabulSites,'Eel Garden')},
      {label:'D4 西巴丹跳島日 2',badge:'配額日',site:findSite(sipadanSites,'Whitetip Avenue')},
      {label:'D5 卡帕來微距日',site:findSite(kapalaiSites,'Mandarin Valley')},
      {label:'D6 馬布島收尾',site:findSite(mabulSites,'Crocodile Avenue'),rest:'下午自由活動，準備返程（潛水後 18 小時內不建議搭機）。'},
      {label:'D7 返程',island:'馬布島',islandLng:118.6167,islandLat:4.2333,
        fromPt:{lng:118.6167,lat:4.2333,label:'馬布島'},toPt:{lng:cityCoord.lng,lat:cityCoord.lat,label:city},
        transport:[
        {icon:'🚗',text:'馬布島→仙本那→斗湖',price:'約 NT$1,200'},
        {icon:'✈️',text:'斗湖→'+city+'（機票）',price:'約 NT$4,500'}
      ]}
    ],
    budget:[
      {label:'斗湖來回機票+快艇',val:'NT$11,400'},
      {label:'潛水套裝（含配額費）',val:'約 NT$13,500'},
      {label:'住宿（6 晚）',val:'約 NT$9,000'}
    ],
    total:'約 NT$33,900'
  };
}
function enterItinerary(){
  mode='itinerary';
  level='country';selCountry=itinerary.country||'my';selIsland=null;
  renderBc();renderSb();
  toggleSb(false);
  clearTransportPoints();
  document.getElementById('mode-pill').style.display='flex';
  searchbox.style.opacity='0.4';
  clearMk();
  itinerary.days.forEach(function(d,i){
    if(d.site){addMk(d.site.lng,d.site.lat,(i+1),function(){selectItinDay(i);},'itin');var m=currentMarkers[currentMarkers.length-1];m.el.innerHTML='<div class="ring itin">'+(i+1)+'</div><div class="lbl">'+d.site.name+'</div>';}
    else if(d.island){addMk(d.islandLng,d.islandLat,(i+1),function(){selectItinDay(i);},'itin');var m2=currentMarkers[currentMarkers.length-1];m2.el.innerHTML='<div class="ring itin">'+(i+1)+'</div><div class="lbl">'+d.island+'</div>';}
  });
  renderFullItinerary();
  selectItinDay(0);
  var allPoints=itinerary.days.filter(function(d){return d.site||d.island;}).map(function(d){return d.site?d.site:{lng:d.islandLng,lat:d.islandLat};});
  var cLng0=selCountry==='mv'?73:114,cLat0=selCountry==='mv'?4:4;
  var v=fitViewAroundCenter(allPoints,cLng0,cLat0,6,3,9,4);flyTo(v.lng,v.lat,v.scale);
  document.querySelector('.stats .st-v').textContent=selCountry==='mv'?'行程模式：馬爾地夫四方線':'行程模式：馬布島 · 西巴丹 · 卡帕來';
}
function renderFullItinerary(){
  var p=document.getElementById('panel');
  p.classList.add('open','itin-open');p.classList.remove('expanded');
  var isLiveaboard=chatState.diveStyle==='船宿巡航';
  var html='<div class="itin-scroll"><div class="itin-hdr">';
  html+='<div class="itin-tag">✨ AI 行程建議</div>';
  html+='<div class="itin-ttl">'+itinerary.title+'</div>';
  if(isLiveaboard){
    html+='<div class="itin-meta"><div class="itin-meta-item">📅 '+(chatState.days||'')+'</div><div class="itin-meta-item">🎯 '+(chatState.cert||'')+'</div></div>';
    html+='<div class="itin-match"><span class="itin-match-tag">符合：船宿巡航</span><span class="itin-match-tag">出發：'+(chatState.departureCity||'新加坡')+'</span></div>';
  } else {
    html+='<div class="itin-meta"><div class="itin-meta-item">📅 8月中，7天</div><div class="itin-meta-item">🎯 AOW/30+潛</div></div>';
    html+='<div class="itin-match"><span class="itin-match-tag">符合：海龜/鯊魚</span><span class="itin-match-tag">符合：15-30k</span></div>';
  }
  html+='</div>';
  if(isLiveaboard){
    html+='<div class="itin-note">ℹ️ <strong style="color:var(--amber)">重要限制：</strong>船宿行程需視天氣狀況調整路線，實際航點順序可能因海況變動。</div>';
  } else {
    html+='<div class="itin-note">ℹ️ <strong style="color:var(--amber)">重要限制：</strong>西巴丹禁止過夜且每日配額有限，行程用馬布島當基地跳島潛水，這是排列核心邏輯。</div>';
  }
  html+='<div class="itin-days" id="itin-days-list">';
  itinerary.days.forEach(function(d,i){
    html+='<div class="itin-day" data-idx="'+i+'" onclick="selectItinDay('+i+')">';
    html+='<div class="itin-day-dot" id="dot-'+i+'"></div>';
    html+='<div class="itin-day-hdr"><span class="itin-day-num">第'+(i+1)+'天</span><span class="itin-day-date">'+d.label.replace(/^D\d+\s*/,'')+'</span>'+(d.badge?'<span class="itin-day-badge">'+d.badge+'</span>':'')+'</div>';
    if(d.transport){d.transport.forEach(function(t){html+='<div class="transport-mini"><div class="transport-mini-text">'+t.icon+' '+t.text+'</div><div class="transport-mini-price">'+t.price+'</div></div>';});}
    if(d.site){html+='<div class="mini-site" id="site-'+i+'"><div class="mini-site-name">'+d.site.name+'</div><div class="mini-site-tags"><span class="mini-tag tb">'+d.site.diff+'</span>'+(d.site.wild?'<span class="mini-tag tg">'+d.site.wild+'</span>':'')+'</div><div class="mini-desc">'+d.site.desc+'</div></div>';}
    else if(d.island){html+='<div class="mini-site" id="site-'+i+'"><div class="mini-site-name">'+d.island+'</div></div>';}
    if(d.rest){html+='<div class="rest-mini">'+d.rest+'</div>';}
    html+='</div>';
  });
  html+='</div></div>';
  html+='<div class="budget-box"><div class="budget-ttl">預算試算（單人）</div>';
  itinerary.budget.forEach(function(b){html+='<div class="budget-row"><span>'+b.label+'</span><span style="color:var(--t)">'+b.val+'</span></div>';});
  html+='<div class="budget-total"><span class="budget-total-label">預估總計</span><span class="budget-total-val">'+itinerary.total+'</span></div></div>';
  html+='<div class="itin-caveat">ℹ️ <span>交通與價格為參考估算，實際生成時會查詢真實選項。</span></div>';
  p.innerHTML=html;
}
window.selectItinDay=function(i){
  document.querySelectorAll('.itin-day-dot').forEach(function(el,idx){el.classList.toggle('sel',idx===i);});
  document.querySelectorAll('.mini-site').forEach(function(el){el.classList.remove('sel');});
  var siteEl=document.getElementById('site-'+i);if(siteEl)siteEl.classList.add('sel');
  var d=itinerary.days[i];
  currentMarkers.forEach(function(m){m.el.classList.remove('sel');});
  if(d.fromPt&&d.toPt){
    showTransportPoints(d.fromPt,d.toPt);
    var v=fitViewAroundCenter([{lng:d.fromPt.lng,lat:d.fromPt.lat},{lng:d.toPt.lng,lat:d.toPt.lat}],(d.fromPt.lng+d.toPt.lng)/2,(d.fromPt.lat+d.toPt.lat)/2,6,0.5,10,4);
    flyTo(v.lng,v.lat,v.scale);
  } else {
    clearTransportPoints();
    if(d.site||d.island){
      var mkIdx=itinerary.days.slice(0,i+1).filter(function(x){return x.site||x.island;}).length-1;
      if(currentMarkers[mkIdx]){
        currentMarkers[mkIdx].el.classList.add('sel');
        var lng=d.site?d.site.lng:d.islandLng,lat=d.site?d.site.lat:d.islandLat;
        flyTo(lng,lat,Math.max(camScale,13));
      }
    }
  }
  drawRoute();
};
function exitItinerary(){
  mode='explore';itinerary=null;chatState={};
  document.getElementById('mode-pill').style.display='none';
  searchbox.classList.remove('ai-mode');searchbox.style.opacity='1';
  searchIcon.textContent='🔍';searchIcon.style.color='';
  searchInput.disabled=false;searchInput.value='';
  if(routeLine){map.removeLayer(routeLine);routeLine=null;}
  clearTransportPoints();
  level='world';selCountry=null;selIsland=null;selSite=null;
  document.getElementById('panel-peek').classList.add('hidden');
  render();
  closePanel();
  toggleSb(true);
}
document.getElementById('exit-itin').onclick=exitItinerary;

loadWorld();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(err){console.warn('Service worker 註冊失敗（不影響網站正常使用）',err);});
  });
}
</script>
